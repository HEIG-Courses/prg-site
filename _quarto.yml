project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!docs/"
  resources:
    - "ressources/**"
    - "!ressources/**/*.qmd"
    - "slides/*.pdf"

website:
  title: "PRG - Programmation procédurale"
  page-navigation: true
  search: true
  sidebar:
    style: docked
    logo: assets/heig-vd.svg
    contents:
      - href: index.qmd
        text: "Planning"
      - href: materiel/index.qmd
        text: "Matériel de cours"
      - href: labos/index.qmd
        text: "Laboratoires"
      - href: exercices/index.qmd
        text: "Exercices"
      - section: "Guides"
        contents:
          - href: guides/installation.qmd
            text: "Installation C++ et CLion"
          - href: guides/git.qmd
            text: "Git en pratique"
          - href: guides/assertions.qmd
            text: "Assertions et premiers tests"
      - href: ressources/index.qmd
        text: "Ressources"

format:
  html:
    theme: [litera, assets/prg.scss]
    lang: fr
    lightbox: true
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true
