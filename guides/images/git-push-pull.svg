<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, sans-serif" font-size="15">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
  </defs>
  <g stroke="#343a40" stroke-width="1.5" fill="#ffffff">
    <rect x="320" y="20" width="220" height="90" rx="8"/>
    <rect x="40" y="220" width="260" height="90" rx="8"/>
    <rect x="560" y="220" width="260" height="90" rx="8"/>
  </g>
  <g fill="#212529" text-anchor="middle">
    <text x="430" y="50" font-weight="600">GitHub (origin)</text>
    <text x="430" y="74">dépôt du groupe</text>
    <text x="430" y="94">historique complet</text>
    <text x="170" y="250" font-weight="600">Vous</text>
    <text x="690" y="250" font-weight="600">Votre binôme</text>
    <text x="170" y="274">votre copie</text>
    <text x="690" y="274">sa copie</text>
  </g>
  <g stroke="#343a40" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="140" y1="218" x2="350" y2="112"/>
    <line x1="380" y1="112" x2="200" y2="218"/>
    <line x1="720" y1="218" x2="510" y2="112"/>
    <line x1="480" y1="112" x2="660" y2="218"/>
  </g>
  <g fill="#212529" font-family="ui-monospace, monospace" font-size="14">
    <text x="170" y="150">git push</text>
    <text x="300" y="196">git pull</text>
    <text x="620" y="150" text-anchor="end">git push</text>
    <text x="560" y="196" text-anchor="end">git pull</text>
  </g>
  <text x="430" y="180" fill="#6c757d" text-anchor="middle" font-size="14">à chaque séance</text>
</svg>
